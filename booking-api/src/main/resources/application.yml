server:
  port: 8080

spring:
  application:
    name: ticket-booking-system

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2000ms

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticket_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

    primary:
      url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticket_db}
      username: ${SPRING_DATASOURCE_USERNAME:postgres}
      password: ${SPRING_DATASOURCE_PASSWORD:password}
      driver-class-name: org.postgresql.Driver
      hikari:
        pool-name: HikariPool-Primary-Writer
        maximum-pool-size: 15
        minimum-idle: 5

      replica:
        url: ${SPRING_DATASOURCE_REPLICA_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticket_db}}
        username: ${SPRING_DATASOURCE_USERNAME:postgres}
        password: ${SPRING_DATASOURCE_PASSWORD:password}
        driver-class-name: org.postgresql.Driver
        hikari:
          pool-name: HikariPool-Replica-Reader
          maximum-pool-size: 25
          minimum-idle: 10

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:127.0.0.1}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 100ms
          multiplier: 2.0
          max-interval: 5000ms

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

    endpoint:
      health:
        show-detail: always

  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://zipkin:7911/api/v2/spans}

logging:
  level:
    com.booking: DEBUG
  pattern:
    level: "%5p [${spring.application.name:ticket-booking-system},%X{traceId:-},%X{spanId:-}]"

resilience4j:
  circuitbreaker:
    instances:
      redisLock:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50.0
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true