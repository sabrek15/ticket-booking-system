server:
  port: 8080

spring:
  application:
    name: ticket-booking-system

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2000ms

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/ticket_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update # Automatically creates tables from entities for local dev
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.booking: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

    endpoint:
      health:
        show-detail: always

resilience4j:
  circuitbreaker:
    instances:
      redisLock:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50.0
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true