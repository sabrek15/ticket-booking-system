server:
  port: 8080

spring:
  application:
    name: ticket-booking-system

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2000ms

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/ticket_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update # Automatically creates tables from entities for local dev
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.booking: DEBUG